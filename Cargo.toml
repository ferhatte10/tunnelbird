[package]
name = "tunnelbird"
version = "0.1.1"
edition = "2024"
description = "Connect to your VPN in one click"
license = "GPL-3.0-or-later"
authors = ["Ferhat Saidoun"]
homepage = "https://ferhatsn.fr"

[workspace]
members = ["crates/core", "crates/service"]
exclude = ["vendor"]

# BoringTun with one change for macOS: see vendor/boringtun/PATCHES.md.
[patch.crates-io]
boringtun = { path = "vendor/boringtun" }

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
base64 = "0.23.1"
futures-channel = "0.3.34"
futures-util = "0.3.34"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tunnelbird-core = { path = "crates/core" }
serde_json = "1.0.154"
soup = { version = "0.9.0", package = "soup3" }
uuid = { version = "1.29.0", features = ["v4"] }
zbus = "6.1.0"
