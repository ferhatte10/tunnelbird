# tunnelbird.ferhatsn.fr behind a reverse proxy (TLS ends there).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirects (/install → /install/) stay relative: the public host and
    # scheme are the proxy's, not this container's.
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;
    error_page 404 /404.html;

    # Pages: always checked again, so a new version shows at once.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Built files carry their hash in their name: cached for a year.
    location /_app/immutable/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Screenshots and the app's film: the pages ask for them with their
    # content fingerprint (?v=, src/lib/assets.ts), so a new version has a
    # new address and these can be kept for a year.
    location /videos/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /screenshots/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Read in a browser before running, so plain text.
    location = /install.sh {
        include /etc/nginx/security-headers.conf;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # The app asks here for the newest version: the release's own latest.json.
    location = /latest.json {
        return 302 https://github.com/ferhatte10/tunnelbird/releases/latest/download/latest.json;
    }

    # Later, from the package-signing job's volume (docs/plans/website.md):
    # /apt/, /rpm/, /tunnelbird.gpg.
}
