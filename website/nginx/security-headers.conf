# Included in every location: nginx drops the server's add_header lines in a
# location that has its own. The rest of the content policy (scripts by hash,
# own files only) is in each page's <meta http-equiv>, written by SvelteKit.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
