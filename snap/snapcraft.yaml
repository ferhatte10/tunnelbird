# Snap package, for the Ubuntu App Center (Snap Store).
# Build: `snapcraft` (needs LXD), or let snapcraft.io build it from the GitHub
# repository. See snap/README.md.
name: tunnelbird
base: core24
adopt-info: tunnelbird
grade: stable
confinement: strict
license: GPL-3.0-or-later
icon: data/icons/hicolor/scalable/apps/fr.ferhatsn.Tunnelbird.svg

platforms:
  amd64:
  arm64:

apps:
  tunnelbird:
    command: bin/tunnelbird
    common-id: fr.ferhatsn.Tunnelbird
    desktop: usr/share/applications/fr.ferhatsn.Tunnelbird.desktop
    # snapd starts the app at login when this file exists in the snap's
    # config folder (written by Preferences › Start at Login).
    autostart: fr.ferhatsn.Tunnelbird.desktop
    # GTK 4.14 and libadwaita 1.5, the minimums Tunnelbird targets.
    extensions: [gnome]
    environment:
      # Translations live inside the snap, not in the base's /usr.
      TUNNELBIRD_LOCALEDIR: $SNAP/usr/share/locale
    plugs:
      - network            # public IP and location lookup
      - network-observe    # tunnel traffic counters
      - network-manager    # list, import, connect and edit tunnels
      - unity7             # top bar icon (StatusNotifierItem)

parts:
  tunnelbird:
    plugin: rust
    source: .
    rust-channel: stable
    build-packages:
      - gettext
    override-build: |
      # The Rust plugin builds and installs the binary into $CRAFT_PART_INSTALL/bin.
      craftctl default
      # Desktop file, icons, metainfo and translations.
      make install-data PREFIX=/usr DESTDIR="$CRAFT_PART_INSTALL"
      # Snap desktop files point to their icon by path.
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/fr.ferhatsn.Tunnelbird.svg|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/fr.ferhatsn.Tunnelbird.desktop"
    parse-info:
      - usr/share/metainfo/fr.ferhatsn.Tunnelbird.metainfo.xml
