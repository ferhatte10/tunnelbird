name: Flatpak

# The Flatpak builds offline from build-aux/flatpak/cargo-sources.json. After a dependency update it is
# usually stale, and this fails; regenerate it with
#   flatpak-cargo-generator.py Cargo.lock -o build-aux/flatpak/cargo-sources.json

on:
  pull_request:
    paths:
      - build-aux/flatpak/**
      - Cargo.lock
      - .github/workflows/flatpak.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: build-aux/flatpak/fr.ferhatsn.Tunnelbird.json
          bundle: tunnelbird.flatpak
          cache-key: flatpak-builder-${{ hashFiles('build-aux/flatpak/**') }}
