[package]
name = "tunnelbird-service"
version = "0.1.1"
edition = "2024"
description = "Tunnelbird's tunnel service for Windows and macOS: stores tunnels and drives the VPN drivers"
license = "GPL-3.0-or-later"
authors = ["Ferhat Saidoun"]
publish = false

[dependencies]
# English messages: the native interfaces translate by error code.
tunnelbird-core = { path = "../core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
boringtun = { version = "0.7.1", default-features = false, features = ["device"] }
